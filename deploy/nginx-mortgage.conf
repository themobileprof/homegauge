# Nginx snippet for themobileprof.com — proxy /mortgage → HomeGauge
#
# Apply (requires sudo on the server):
#   sudo cp deploy/nginx-mortgage.conf /etc/nginx/snippets/mortgage.conf
#   # then add inside the HTTPS server block of themobileprof.com.conf:
#   #   include snippets/mortgage.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# Port layout:
#   :3035  Next.js standalone (web UI, serves /mortgage/*)
#   :8085  Go API             (serves /api/v1/*)

# Static public assets — served directly by nginx, no proxy hop needed.
# Next standalone copies public/ into web/public; map /mortgage/* → filesystem.
# Also serve without the basePath prefix since unoptimized <Image> emits /images/...
location /mortgage/images/ {
    alias /home/samuel/apps/homegauge/web/public/images/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Next.js built static chunks — also served directly for speed.
location /mortgage/_next/static/ {
    alias /home/samuel/apps/homegauge/web/.next/static/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Everything else under /mortgage (pages, API proxy, image optimizer) → Next.
location /mortgage {
    proxy_pass         http://127.0.0.1:3035;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_read_timeout 60s;
}

# Next.js handles /api proxy rewrites internally (API_PROXY_TARGET=:8085).
